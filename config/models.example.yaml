# 统一配置：所有角色默认使用
default:
  provider: deepseek
  model: deepseek-flash
  api_key: "sk-your-deepseek-api-key"
  base_url: "https://api.deepseek.com/v1"
  temperature: 0.2

# 单次运行预算上限（元），0 = 不限
budget_cny: 0

# 可选：覆盖默认价格（元 / 百万 token）
pricing:
  deepseek-flash:
    input: 1.0
    output: 2.0
  deepseek-v4-pro:
    input: 3.0
    output: 6.0

# 可选：按角色单独配置。未填写的字段回落到 default。
roles:
