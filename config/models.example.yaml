# 统一配置：所有角色默认使用
default:
  provider: deepseek
  model: deepseek-flash
  api_key: "sk-your-deepseek-api-key"
  base_url: "https://api.deepseek.com/v1"
  temperature: 0.2

# 只统计 token，不计算金额（各厂商价格/缓存/折扣差异较大，避免内置价格滞后）
# 也不设预算上限。

# 可选：按角色单独配置。未填写的字段回落到 default。
roles:
